name: Copybook data

# Pulls new SEC 13F-HR filings, plus Form 4 and Schedule 13D/G filings by the
# curated managers, into public/copybook/data. Code lives in
# factordynamics/site (copybook/ingest). Data only; pages are not touched.
# Full per-quarter books (data/h/**) are paid data: they go to the Copy API's
# private R2 bucket and are never committed here. The Actions cache keeps them
# between runs so unchanged quarters are neither refetched nor re-uploaded.
# Scope: `full` (every filer, data sets, tickers) or `curated` (the curated funds and their
# Form 4 / 13D/G events only, about 10-15 minutes). The Copy API Worker dispatches this on a
# new curated filing (curated) and every 3 hours (full). Until its GitHub token exists, the
# :08/:28/:48 cron runs a curated refresh; drop those three entries once the Worker triggers work.
on:
  schedule:
    - cron: "23 */3 * * *"   # full backstop
    - cron: "8,28,48 * * * *"  # interim curated refresh
  workflow_dispatch:
    inputs:
      scope:
        description: "full or curated"
        type: choice
        options: [full, curated]
        default: full
      reason:
        description: "Why this run was started (shown in the run name)"
        required: false
      accession:
        description: "Filing that triggered it (logged only)"
        required: false

run-name: "Copybook data (${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}) ${{ inputs.reason }}"

# One full and one curated run can be in flight; a curated run steps aside while a full
# run is going (the full run refreshes the curated funds too), so neither cancels the other.
concurrency:
  group: copybook-data-${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}
  cancel-in-progress: false

env:
  SCOPE: ${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Skip a curated run while a full run is going
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "scope=$SCOPE accession=${{ inputs.accession }}"
          if [ "$SCOPE" = curated ]; then
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow copybook-data.yml --status in_progress \
              --json databaseId,displayTitle -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.displayTitle | contains(\"(full)\"))] | length")
            if [ "${busy:-0}" != 0 ]; then echo "A full run is in progress; it refreshes the curated funds too."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: factordynamics/site
          path: _ingest
          sparse-checkout: copybook
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/.h-manifest.json
          key: copybook-h-${{ github.run_id }}
          restore-keys: copybook-h-
      # Full 13F books for every filer (paid; never committed): only full runs need them.
      - uses: actions/cache/restore@v4
        if: env.SCOPE == 'full'
        with:
          path: public/copybook/data/fb
          key: copybook-fb-${{ github.run_id }}
          restore-keys: copybook-fb-
      - name: Ingest 13F filings
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
          COPYBOOK_CUSIP_MAP: public/copybook/data/cusip_map.json
          COPYBOOK_HISTORY_QUARTERS: "8"
          COPYBOOK_BULK_BUDGET_S: "5400"
          COPYBOOK_BULK_REVERSE: "1"
          COPYBOOK_FIGI_BUDGET_S: "900"
          COPYBOOK_SEC_BUDGET_S: "900"
          COPYBOOK_EVENTS_BUDGET_S: "900"
        run: |
          # Each step stands alone so one failure still publishes the rest.
          I=_ingest/copybook/ingest
          python $I/build.py || echo "::warning::curated build failed"
          if [ "$SCOPE" = full ]; then
            if [ -f $I/datasets.py ]; then python $I/datasets.py || echo "::warning::SEC 13F data sets failed"; fi
            python $I/bulk.py || echo "::warning::bulk ingest failed"
            python $I/figi.py public/copybook/data || echo "::warning::ticker lookup failed"
            python $I/securities.py public/copybook/data || echo "::warning::securities failed"
          fi
          python $I/enrich.py || echo "::warning::enrich failed"
          python $I/events.py || echo "::warning::Form 4 / 13D/G events failed"
          if [ "$SCOPE" = full ]; then
            python $I/stocks.py || echo "::warning::stock holder index failed"
          fi
      # A failed gate stops the run here: nothing goes to R2 or Pages, so the live data stays.
      - name: Refuse to publish a build that lost tickers
        run: |
          G=_ingest/copybook/ingest/gate.py
          if [ -f $G ]; then python $G public/copybook/data; fi
      - name: Upload paid history to R2
        id: upload
        continue-on-error: true
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
        # Any non-200 fails this step; h/ then stays on Pages (see commit step) and the job fails at the end.
        run: python _ingest/copybook/ingest/upload_history.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/.h-manifest.json
          key: copybook-h-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && env.SCOPE == 'full'
        with:
          path: public/copybook/data/fb
          key: copybook-fb-${{ github.run_id }}
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.upload.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # h/ leaves Pages only once every file is in R2; otherwise the Pages copy stays as the fallback.
          if [ "$UPLOADED" = success ]; then
            git rm -r -q --cached --ignore-unmatch public/copybook/data/h
          fi
          git add public/copybook/data
          if git diff --staged --quiet; then echo "No new filings"; exit 0; fi
          git commit -q -m "Refresh Copybook 13F data ($SCOPE)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs && git push -q; then
              gh workflow run ci.yml --ref main
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Fail if the R2 upload failed
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::error::Paid history upload to R2 failed; public data was published and h/ stays on Pages."
          exit 1

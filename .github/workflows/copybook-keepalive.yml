name: Copybook keepalive

# GitHub's scheduler skips copybook-data.yml runs (none fired for 7 hours on Nov 8), and the
# Copy API Worker can dispatch it only once it has a GitHub token. Until then this chain keeps
# the data fresh with GITHUB_TOKEN alone: workflow_dispatch is the documented exception that a
# GITHUB_TOKEN may trigger. One job loops for about 5 hours, starting a curated refresh every 5 minutes
# unless one is queued or running, and a full one beside it when the last full run is 3 hours old, then dispatches its successor. The concurrency group keeps one chain; the
# cron restarts it if it dies. It ends itself once Worker-dispatched runs appear.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

concurrency:
  group: copybook-keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      # Every minute: a curated fund's new 13F on EDGAR's current feed (copybook-filings.py) starts a curated filing
      # run at once, in its own lane (copybook-data.yml concurrency), so it never queues behind a keepalive
      # (cycle plan, Nov 19). Every 5 minutes, as before: a keepalive, and a full run when the last is 3 hours old.
      - name: Dispatch Copybook refreshes
        run: |
          # ghr (copybook-gh.sh): gh, retried through GitHub's 5xx and network errors for up to 30 min a call.
          . .github/copybook-gh.sh
          runs() { ghr run list --workflow copybook-data.yml -L 60 --json status,displayTitle,createdAt "$@"; }
          age() { echo $(( $(date -u +%s) - $(date -u -d "$1" +%s) )); }
          start=$SECONDS
          tick=0
          dispatched=" "
          while [ $((SECONDS - start)) -lt 18000 ]; do
            titles=$(runs -q '.[].displayTitle')
            for acc in $(python3 .github/copybook-filings.py); do
              if [[ "$dispatched" == *" $acc "* ]] || grep -q "filing $acc" <<< "$titles"; then continue; fi
              echo "$(date -u +%T) dispatch filing $acc"
              ghr workflow run copybook-data.yml --ref main -f scope=curated -f reason="filing $acc" -f accession="$acc" \
                && dispatched="$dispatched$acc " || echo "::warning::dispatch failed"
            done
            tick=$((tick + 1))
            # Every 15 minutes: the stale-publish check (copybook-stale.yml). Its own */15 cron is best-effort: GitHub
            # ran it 3 times in its first 17 hours (Nov 21 20:32Z, Nov 22 00:41Z and 07:29Z), so it stays only as a backup.
            if [ $((tick % 15)) = 1 ]; then
              ghr workflow run copybook-stale.yml --ref main || echo "::warning::stale-check dispatch failed"
            fi
            if [ $((tick % 5)) != 1 ]; then sleep 60; continue; fi
            since=$(date -u -d '-4 hours' +%FT%TZ)
            worker=$(runs -q "[.[] | select(.createdAt > \"$since\") | select(.displayTitle | contains(\"copybook-api\") or contains(\"filing by \"))] | length")
            if [ "${worker:-0}" != 0 ]; then echo "The Copy API Worker is dispatching refreshes; ending the chain."; exit 0; fi
            # A full run takes ~2.5 h; curated runs (new 13F-HRs within minutes) go on beside it.
            busy() { runs -q "[.[] | select(.status != \"completed\") | select(.displayTitle | contains(\"($1)\"))] | length"; }
            # Keep one curated run queued behind the running one (the concurrency group runs them one at a time), so
            # the next starts the moment the last ends: no 0-5 min gap, and never two fetching from SEC at once.
            waiting() { runs -q "[.[] | select(.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\") | select(.displayTitle | contains(\"($1)\"))] | length"; }
            if [ "$(waiting curated)" = 0 ]; then
              echo "$(date -u +%T) dispatch curated"
              ghr workflow run copybook-data.yml --ref main -f scope=curated -f reason=keepalive || echo "::warning::dispatch failed"
            else
              echo "$(date -u +%T) a curated run is already queued; skip"
            fi
            last_full=$(runs -q '[.[] | select(.displayTitle | contains("(full)"))][0].createdAt // "1970-01-01T00:00:00Z"')
            if [ "$(busy full)" = 0 ] && [ "$(age "$last_full")" -ge 10800 ]; then
              echo "$(date -u +%T) dispatch full"
              ghr workflow run copybook-data.yml --ref main -f scope=full -f reason=keepalive || echo "::warning::dispatch failed"
            fi
            sleep 60
          done
          ghr workflow run copybook-keepalive.yml --ref main

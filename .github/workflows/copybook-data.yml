name: Copybook data

# Pulls new SEC 13F-HR filings, plus Form 4 and Schedule 13D/G filings by the
# curated managers, into public/copybook/data. Code lives in
# factordynamics/site (copybook/ingest). Data only; pages are not touched.
# Full per-quarter books (data/h/**) are paid data: they go to the Copy API's
# private R2 bucket and are never committed here. The Actions cache keeps them
# between runs so unchanged quarters are neither refetched nor re-uploaded.
# Scope: `full` (every filer, data sets, tickers) or `curated` (the curated funds and their
# Form 4 / 13D/G events only, about 10-15 minutes). The Copy API Worker dispatches this on a
# new curated filing (curated) and every 3 hours (full). Until its GitHub token exists, the
# :08/:28/:48 cron runs a curated refresh; drop those three entries once the Worker triggers work.
on:
  schedule:
    - cron: "23 */3 * * *"   # full backstop
    - cron: "8,28,48 * * * *"  # interim curated refresh
  workflow_dispatch:
    inputs:
      scope:
        description: "full or curated"
        type: choice
        options: [full, curated]
        default: full
      reason:
        description: "Why this run was started (shown in the run name)"
        required: false
      accession:
        description: "Filing that triggered it (logged only)"
        required: false
      accept_types:
        description: "Publish an accepted filer-type reclass (Form ADV) even if a type's count moves over 10%; this run only"
        type: boolean
        default: false

run-name: "Copybook data (${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}) ${{ inputs.reason }}"

# One full and one curated run can be in flight at once; neither cancels or waits for the other.
# A snapshot never replaces a newer one at head (see the push step).
concurrency:
  group: copybook-data-${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}
  cancel-in-progress: false

env:
  SCOPE: ${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}
  # Filer types (copybook/ingest/filer_types.py, gate.py): the classifier runs when COPYBOOK_TYPES_RECLASS is 1 (repo
  # variable, or this dispatch's accept_types); a type count moving over 10% publishes only with accept_types.
  COPYBOOK_TYPES_RECLASS: ${{ (inputs.accept_types && '1') || vars.COPYBOOK_TYPES_RECLASS || '' }}
  COPYBOOK_TYPES_ACCEPTED: ${{ (inputs.accept_types && '1') || '' }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Skip a curated run while a full run is going
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "scope=$SCOPE accession=${{ inputs.accession }}"
          # Curated refreshes always run, also while a long full run is going: the season data must
          # never wait for a full rebuild. The push step keeps whichever snapshot is newer.

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: factordynamics/site
          path: _ingest
          # holdterm/src: roster.json names the funds whose books go into data/books.json (books.py)
          sparse-checkout: |
            copybook
            holdterm/src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/.h-manifest.json
          key: copybook-h-${{ github.run_id }}
          restore-keys: copybook-h-
      # Full 13F books for every filer (paid; never committed): only full runs need them.
      # Curated runs restore it too (read-only, never saved) to rebuild hl/ when a tracked fund files.
      - uses: actions/cache/restore@v4
        with:
          path: public/copybook/data/fb
          key: copybook-fb-${{ github.run_id }}
          restore-keys: copybook-fb-
      - name: Ingest 13F filings
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
          COPYBOOK_CUSIP_MAP: public/copybook/data/cusip_map.json
          COPYBOOK_HISTORY_QUARTERS: "8"
          COPYBOOK_BULK_BUDGET_S: "5400"
          COPYBOOK_BULK_REVERSE: "1"
          COPYBOOK_FIGI_BUDGET_S: "900"
          COPYBOOK_SEC_BUDGET_S: "900"
          # SEC fair access: one full and one curated run can fetch at once, so together they stay under 10 req/s
          # (full 3.3 + curated 6.25 = 9.6). Every SEC request goes through edgar.get, one process per run.
          COPYBOOK_SEC_INTERVAL: ${{ env.SCOPE == 'full' && '0.3' || '0.16' }}
          COPYBOOK_EVENTS_BUDGET_S: "900"
          COPYBOOK_ACCEPTED_BUDGET_S: "2100"
        run: |
          # Required steps fail the run, so nothing is uploaded or published and the live data stays.
          # Optional steps (external lookups that resume next run) only warn and keep their previous output.
          I=_ingest/copybook/ingest
          if [ "$SCOPE" = full ]; then
            # optional: SEC 13F data sets (seeds the fb/ full books once per period; stocks.py falls back to f/).
            # Before build.py, whose split detection reads every filer's full books.
            if [ -f $I/datasets.py ]; then python $I/datasets.py || echo "::warning::optional: SEC 13F data sets failed"; fi
          fi
          python $I/build.py
          if [ "$SCOPE" = full ]; then
            # optional: all-filer shards (time-budgeted; picks up where it stopped next run)
            python $I/bulk.py || echo "::warning::optional: bulk ingest failed"
            # optional: OpenFIGI lookups for new CUSIPs (the cached map covers the rest)
            python $I/figi.py public/copybook/data || echo "::warning::optional: ticker lookup failed"
            python $I/securities.py public/copybook/data
          fi
          python $I/enrich.py
          # optional: Form 4 / 13D/G events (the previous events files stay)
          python $I/events.py || echo "::warning::optional: Form 4 / 13D/G events failed"
          if [ "$SCOPE" = full ]; then
            # optional: filer type per CIK (hedge_fund, active, index, bank, ...), read by stocks.py and moves.py
            if [ -f $I/filer_types.py ]; then python $I/filer_types.py || echo "::warning::optional: filer types failed"; fi
          else
            # reviewed type cases on top of the last full run's types (the gate checks them every run)
            python $I/filer_types.py --overrides
            # A tracked fund filed a new 13F-HR: rebuild hl/ now (about 5 minutes), not at the next full run.
            new=$(python3 -c 'import json; print(len(json.load(open("public/copybook/data/alerts.json")).get("new_filings") or []))' || echo 0)
            # Or the type set changed (hand overrides above): hl/, hedge_flow.json and fall/ follow it now, so every
            # lens matches filer_types.json and index.json types_as_of.
            stale=$(python $I/filer_types.py --lenses-stale || echo 0)
            if { [ "${new:-0}" != 0 ] || [ "${stale:-0}" = 1 ]; } && [ -d public/copybook/data/fb ]; then
              echo "rebuilding hl/: new=${new:-0} lenses_stale=${stale:-0}"
              python $I/moves.py || echo "::warning::optional: filer moves failed"
            fi
          fi
          if [ "$SCOPE" = full ]; then
            python $I/stocks.py
            # optional: EDGAR acceptance time for every shard's filing (hl/ rows, changes, fq/ books)
            if [ -f $I/accepted.py ]; then python $I/accepted.py || echo "::warning::optional: acceptance times failed"; fi
            # optional: every filer's moves vs its previous quarter (shard summary public, full rows to R2)
            if [ -f $I/moves.py ]; then python $I/moves.py || echo "::warning::optional: filer moves failed"; fi
            # optional: bulk/{quarter}.csv.gz exports for the Copy API (R2 only)
            if [ -f $I/export.py ]; then python $I/export.py || echo "::warning::optional: bulk export failed"; fi
          fi
          # optional, last: Holdterm's funds' books in one file, after every step that writes {slug}.json
          if [ -f $I/books.py ]; then python $I/books.py || echo "::warning::optional: books.json failed"; fi
      # A failed gate stops the run here: nothing goes to R2 or Pages, so the live data stays.
      - name: Refuse to publish a build that lost tickers
        run: |
          G=_ingest/copybook/ingest/gate.py
          if [ -f $G ]; then python $G public/copybook/data; fi
      - name: Upload paid history to R2
        id: upload
        # Resumed 2026-11-09 at the API's go: one bundle at a time, at most 100 files / 20 MB each.
        continue-on-error: true
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
          # The self-hosted Copy API through Tailscale Funnel: no 100 s cap (the trycloudflare tunnel in api.json
          # returned HTTP 524 on a 19 MB bundle) and no Cloudflare bulk traffic. Bundles stay at 5 MB.
          COPYBOOK_API: https://gene.tail70ba3.ts.net/copybook
          # Curated runs upload for at most 3 minutes so publishing a new filing never waits; the rest goes next run.
          COPYBOOK_UPLOAD_BUDGET_S: ${{ env.SCOPE == 'full' && '3000' || '180' }}
          # No uploads in these windows (runner's clean Funnel timing, Nov 11; EDGAR is closed then). Remove after.
          COPYBOOK_UPLOAD_QUIET: "2026-11-11T09:15:00Z/2026-11-11T10:00:00Z"
        # Any non-200 fails this step; h/ then stays on Pages (see commit step) and the job fails at the end.
        run: python _ingest/copybook/ingest/upload_history.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/.h-manifest.json
          key: copybook-h-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && env.SCOPE == 'full'
        with:
          path: public/copybook/data/fb
          key: copybook-fb-${{ github.run_id }}
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.upload.outcome }}
          # Fine-grained token with actions:write on factordynamics/site: rebuilds the site right after new data.
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # h/ leaves Pages only once every file is in R2; otherwise the Pages copy stays as the fallback.
          if [ "$UPLOADED" = success ]; then
            git rm -r -q --cached --ignore-unmatch public/copybook/data/h
          fi
          # Never publish a snapshot older than head. A curated run that lost the race publishes nothing;
          # a full run keeps its all-filer outputs and takes the newer curated snapshot from head.
          D=public/copybook/data
          gen() { python3 -c 'import json,sys; print(json.load(sys.stdin).get("generated_at") or "")' 2>/dev/null; }
          git fetch -q origin main
          HEAD_GEN=$(git show origin/main:$D/index.json 2>/dev/null | gen)
          OUR_GEN=$(gen < $D/index.json)
          if [ -n "$HEAD_GEN" ] && [[ "$HEAD_GEN" > "$OUR_GEN" ]]; then
            if [ "$SCOPE" = curated ]; then echo "Head has a newer snapshot ($HEAD_GEN > $OUR_GEN); nothing to publish"; exit 0; fi
            echo "Head has a newer curated snapshot ($HEAD_GEN > $OUR_GEN); publishing only the all-filer outputs on top of it"
            KEEP="f fall hl hedge_flow.json filers.json filer_types.json types_guard.json stock_holders.json securities.json issuers.json cusip_map.json splits.json"
            T=$(mktemp -d)
            for k in $KEEP; do if [ -e $D/$k ]; then cp -r $D/$k $T/; fi; done
            git checkout origin/main -- $D
            for k in $KEEP; do if [ -e $T/$k ]; then rm -rf $D/$k; cp -r $T/$k $D/; fi; done
            # head's index.json, with this run's type set date (the lenses above use this run's types)
            python3 -c 'import json,sys; d=sys.argv[1]; i=json.load(open(d+"/index.json")); i["types_as_of"]=json.load(open(d+"/filer_types.json")).get("as_of") or i.get("types_as_of"); open(d+"/index.json","w").write(json.dumps(i,separators=(",",":"))+"\n")' $D
          fi
          git add public/copybook/data
          if git diff --staged --quiet; then echo "No new filings"; exit 0; fi
          git commit -q -m "Refresh Copybook 13F data ($SCOPE)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs && git push -q; then
              gh workflow run ci.yml --ref main
              if [ -n "$SITE_DISPATCH_TOKEN" ]; then
                GH_TOKEN="$SITE_DISPATCH_TOKEN" gh workflow run copybook-pages.yml -R factordynamics/site --ref main \
                  || echo "::warning::site build dispatch failed"
              else
                echo "::notice::SITE_DISPATCH_TOKEN not set; the site rebuilds on its own schedule"
              fi
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Fail if the R2 upload failed
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::error::Paid history upload to R2 failed; public data was published and h/ stays on Pages."
          exit 1

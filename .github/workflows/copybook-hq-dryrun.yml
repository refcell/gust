name: Copybook hq/ dry run

# Branch x1000-check only (never merged): classifies every cached h/ book's options with site main and with a site
# branch, and lists every option line whose classification differs. Read-only: restores the h/ cache and never saves
# one, makes no SEC request, uploads nothing to R2 and commits nothing.
on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: "factordynamics/site branch or commit to compare with site main"
        required: true
        default: x1000
      reseed:
        description: "unused on this branch"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: copybook-hq-dryrun
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: factordynamics/site
          ref: main
          path: _old
          sparse-checkout: copybook
      - uses: actions/checkout@v4
        with:
          repository: factordynamics/site
          ref: ${{ inputs.site_ref }}
          path: _new
          sparse-checkout: copybook
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/hlf
            public/copybook/data/.h-manifest.json
          key: copybook-h-x1000-check-${{ github.run_id }}
          restore-keys: copybook-h-
      - name: Classify every cached book's options, main vs branch
        env:
          COPYBOOK_WEB_DIR: public/copybook
          COPYBOOK_CUSIP_MAP: public/copybook/data/cusip_map.json
        run: |
          cat > /tmp/classify.py <<'EOF'
          import json, sys
          from pathlib import Path
          from ingest import build
          out, books, lines = {}, 0, 0
          for p in sorted(Path("public/copybook/data/h").glob("*/*.json")):
              if p.name.endswith(".v1.json"):
                  continue
              q = json.loads(p.read_text())
              if not q.get("holdings"):
                  continue
              books += 1
              # as cached_quarters() reads a cached quarter back
              q["holdings"] = [{k: v for k, v in h.items() if k != "held_reason"} for h in q["holdings"]]
              c = build.classify_options(q)
              for h in c["holdings"]:
                  if h.get("put_call") and h.get("shares_type") != "PRN":
                      lines += 1
                      out[f"{p.parent.name}/{p.stem} {h['cusip']} {h['put_call']}"] = [h.get("option_held"), h.get("option_ratio"),
                                                                                    h.get("option_benchmark"), c.get("options_basis")]
          json.dump(out, open(sys.argv[1], "w"))
          print(f"{sys.argv[1]}: {books} cached books, {lines} option lines")
          EOF
          ls public/copybook/data/h | wc -l
          git -C _old log --oneline -1; git -C _new log --oneline -1
          PYTHONPATH=_old/copybook python /tmp/classify.py /tmp/old.json
          PYTHONPATH=_new/copybook python /tmp/classify.py /tmp/new.json
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          old, new = json.load(open("/tmp/old.json")), json.load(open("/tmp/new.json"))
          diff = sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k))
          print(f"option lines classified differently, main vs branch: {len(diff)} of {len(old)}")
          for k in diff[:200]:
              print(f"- {k}: {old.get(k)} -> {new.get(k)}")
          EOF

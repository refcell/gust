name: Copybook hq/ dry run

# Builds moves.py from a site branch on the last full run's books, to measure a change before it lands (hq/, Nov 22).
# Read-only: restores the fb/ cache and never saves one, uploads nothing to R2 and commits nothing.
on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: "factordynamics/site branch or commit to run"
        required: true
        default: hlq
      reseed:
        description: "Also re-seed this quarter (datasets.py --reseed) first and report its diff; empty for none"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: copybook-hq-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: factordynamics/site
          ref: ${{ inputs.site_ref }}
          path: _ingest
          sparse-checkout: |
            copybook
            holdterm/src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: public/copybook/data/fb
          key: copybook-fb-dryrun-${{ github.run_id }}
          restore-keys: copybook-fb-
      - name: Add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /mnt/copybook.swap && sudo chmod 600 /mnt/copybook.swap && sudo mkswap -q /mnt/copybook.swap \
            && sudo swapon /mnt/copybook.swap || echo "::warning::could not add swap"
      - name: moves.py (full scope)
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
          COPYBOOK_CUSIP_MAP: public/copybook/data/cusip_map.json
          SCOPE: full
        run: |
          ( while sleep 60; do
              echo "res $(date -u +%T) $(free -m | awk '/^Mem/{printf "mem_used=%sM ",$3} /^Swap/{printf "swap=%s/%sM ",$3,$2}')top=$(ps -eo rss=,args= --sort=-rss | head -1 | awk '{printf "%dM", $1/1024}')"
            done ) &
          ls public/copybook/data/fb
          if [ -n "${{ inputs.reseed }}" ]; then
            python _ingest/copybook/ingest/datasets.py --reseed "${{ inputs.reseed }}" || echo "::warning::re-seed held (see the diff above)"
          fi
          /usr/bin/time -v python _ingest/copybook/ingest/moves.py 2>&1 | grep -vE "^\s+(Minor|Major|Volun|Invol|Swaps|File sys|Socket|Signals|Page size|Exit|Average|Percent)"
      - name: hq/ sizes
        if: always()
        run: |
          D=public/copybook/data
          for q in $D/hq/*Q?; do
            [ -d "$q" ] || continue
            echo "$(basename $q): $(ls $q | wc -l) objects, $(du -sb $q | cut -f1) bytes, index $(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print({k: d[k] for k in ('complete', 'issuers', 'sig')}, len(d['tickers']), 'tickers')" $q/index.json)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          echo "hlf (hl/'s every-holder files): $(ls $D/hlf | wc -l) objects, $(du -sb $D/hlf | cut -f1) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la $D/fb/*/.complete 2>/dev/null || true

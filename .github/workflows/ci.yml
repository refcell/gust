name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# On main a run is never cancelled: data commits land every few minutes, and cancelling the running deploy for each
# one left Pages serving the 13:23 data from 13:53 to 16:10 UTC on Nov 11. Newer pushes queue (GitHub keeps the newest
# pending run), so the deployed data is at most one run behind. Pull requests still cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_PUSH_API: ${{ vars.VITE_PUSH_API }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      # The browser install pulls apt packages; since Nov 11 13:53 UTC it has hung past 10 min on some runners, and
      # every data commit then cancelled the run before Pages deployed (public data stuck at 13:23). Bounded: if it
      # can't install in 4 min, e2e is skipped for this run and the build still deploys.
      - id: pw
        run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 4
        continue-on-error: true
      - run: pnpm e2e
        if: steps.pw.outcome == 'success'
      - if: steps.pw.outcome != 'success'
        run: echo "::warning::playwright install failed or timed out; e2e skipped this run"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

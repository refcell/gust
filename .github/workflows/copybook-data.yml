name: Copybook data

# Pulls new SEC 13F-HR filings, plus Form 4 and Schedule 13D/G filings by the
# curated managers, into public/copybook/data. Code lives in
# factordynamics/site (copybook/ingest). Data only; pages are not touched.
# Full per-quarter books (data/h/**) are paid data: they go to the Copy API's
# private R2 bucket and are never committed here. The Actions cache keeps them
# between runs so unchanged quarters are neither refetched nor re-uploaded.
# Scope: `full` (every filer, data sets, tickers) or `curated` (the curated funds and their
# Form 4 / 13D/G events only, about 10-15 minutes). The Copy API Worker dispatches this on a
# new curated filing (curated) and every 3 hours (full). Until its GitHub token exists, the
# :08/:28/:48 cron runs a curated refresh; drop those three entries once the Worker triggers work.
on:
  schedule:
    - cron: "23 */3 * * *"   # full backstop
    - cron: "8,28,48 * * * *"  # interim curated refresh
  workflow_dispatch:
    inputs:
      scope:
        description: "full or curated"
        type: choice
        options: [full, curated]
        default: full
      reason:
        description: "Why this run was started (shown in the run name)"
        required: false
      accession:
        description: "Filing that triggered it (logged only)"
        required: false
      accept_types:
        description: "Publish an accepted filer-type reclass (Form ADV) even if a type's count moves over 10%; this run only"
        type: boolean
        default: false
      restamp_hl:
        description: "Re-send every hl/ object so meta/builds.json's hl built_at is this build (outside EDGAR hours; up to 50 min of upload)"
        type: boolean
        default: false

run-name: "Copybook data (${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}) ${{ inputs.reason }}"

# Three lanes, none cancelling or waiting for another (cycle plan, Nov 19): full; curated filing runs (reason
# "filing <accession>", dispatched by copybook-keepalive.yml when EDGAR shows a curated fund's 13F), one at a time; and
# curated keepalives (no reason or "keepalive", and the cron), one at a time. A filing run never queues behind a
# keepalive: a keepalive skips while a filing run is active and yields before its upload, cache save and commit
# (copybook-cache.sh filing-active), and a filing run waits for a keepalive's upload in flight. A snapshot never
# replaces a newer one at head (see the push step).
concurrency:
  group: copybook-data-${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}${{ (inputs.scope == 'curated' || (github.event_name == 'schedule' && github.event.schedule != '23 */3 * * *')) && !startsWith(inputs.reason, 'filing') && '-keepalive' || '' }}
  cancel-in-progress: false

env:
  SCOPE: ${{ inputs.scope || (github.event.schedule == '23 */3 * * *' && 'full') || (github.event_name == 'schedule' && 'curated') || 'full' }}
  # 1 for a curated keepalive (see concurrency): it gives way to filing runs.
  KEEPALIVE: ${{ (inputs.scope == 'curated' || (github.event_name == 'schedule' && github.event.schedule != '23 */3 * * *')) && !startsWith(inputs.reason, 'filing') && '1' || '' }}
  # Filer types (copybook/ingest/filer_types.py, gate.py): the classifier runs when COPYBOOK_TYPES_RECLASS is 1 (repo
  # variable, or this dispatch's accept_types); a type count moving over 10% publishes only with accept_types.
  COPYBOOK_TYPES_RECLASS: ${{ (inputs.accept_types && '1') || vars.COPYBOOK_TYPES_RECLASS || '' }}
  COPYBOOK_TYPES_ACCEPTED: ${{ (inputs.accept_types && '1') || '' }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Skip a keepalive while a filing run is going
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "scope=$SCOPE keepalive=${KEEPALIVE:-0} accession=${{ inputs.accession }}"
          # Curated refreshes always run, also while a long full run is going: the season data must
          # never wait for a full rebuild. The push step keeps whichever snapshot is newer.
          # A keepalive while a filing run is queued or running would only fetch the same filings and then yield.
          if [ "$KEEPALIVE" = 1 ] && [ "$(bash .github/copybook-cache.sh filing-active)" != 0 ]; then
            echo "A filing run is active: this keepalive skips"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: factordynamics/site
          path: _ingest
          # holdterm/src: roster.json names the funds whose books go into data/books.json (books.py)
          sparse-checkout: |
            copybook
            holdterm/src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The newest h/ cache saved by a full run or by a curated run no full run superseded (.github/copybook-cache.sh,
      # Nov 16): a curated run that restored before a full run saved must never become the cache later runs restore.
      - name: Pick the h/ cache
        id: hcache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "H_RESTORED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          key=$(bash .github/copybook-cache.sh pick || true)
          echo "h/ cache: ${key:-none picked, newest copybook-h-}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/hlf
            public/copybook/data/.h-manifest.json
          key: ${{ steps.hcache.outputs.key || format('copybook-h-{0}', github.run_id) }}
          restore-keys: copybook-h-
      # Full 13F books for every filer (paid; never committed): only full runs need them.
      # Curated runs restore it too (read-only, never saved) to rebuild hl/ when a tracked fund files.
      - uses: actions/cache/restore@v4
        with:
          path: public/copybook/data/fb
          key: copybook-fb-${{ github.run_id }}
          restore-keys: copybook-fb-
      # Full runs died Nov 14-16 with "The runner has received a shutdown signal" late in moves.py: out of memory.
      # Probe 43805804040 (Nov 16): full-scope moves.py peaks at 15.4 GB resident plus 9.7 GB swapped on a 16 GB
      # runner with 3 GB of swap. A curated run died the same way on Nov 13 (43480790102), so every run adds 16 GB of
      # swap; full runs' Ingest step logs a "res" line every minute (memory, swap, disk, largest process).
      - name: Add swap
        run: |
          free -m; swapon --show; df -h / /mnt 2>/dev/null || true
          d=/; for m in /mnt; do
            if [ -d $m ] && [ "$(df -m --output=avail $m | tail -1)" -gt "$(df -m --output=avail / | tail -1)" ]; then d=$m; fi
          done
          if [ "$(df -m --output=avail $d | tail -1)" -lt 40000 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          sudo fallocate -l 16G $d/copybook.swap && sudo chmod 600 $d/copybook.swap && sudo mkswap -q $d/copybook.swap \
            && sudo swapon $d/copybook.swap || echo "::warning::could not add swap"
          free -m; df -h / /mnt 2>/dev/null || true
      - name: Ingest 13F filings
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
          COPYBOOK_CUSIP_MAP: public/copybook/data/cusip_map.json
          COPYBOOK_HISTORY_QUARTERS: "8"
          COPYBOOK_BULK_BUDGET_S: "5400"
          COPYBOOK_BULK_REVERSE: "1"
          COPYBOOK_FIGI_BUDGET_S: "900"
          COPYBOOK_SEC_BUDGET_S: "900"
          # SEC fair access: a full, a filing and a keepalive run can fetch at once, so together they stay at or under
          # 8 req/s, with headroom below SEC's 10 (lead, Nov 19): full 2 + filing 4 + keepalive 1.8 = 7.8. Filing runs
          # keep the fastest rate. Every SEC request goes through edgar.get, one process per run; a 403 or 429 there
          # pauses and halves the run's rate (site edgar.py).
          COPYBOOK_SEC_INTERVAL: ${{ (env.SCOPE == 'full' && '0.5') || (env.KEEPALIVE == '1' && '0.55') || '0.25' }}
          COPYBOOK_EVENTS_BUDGET_S: "900"
          COPYBOOK_ACCEPTED_BUDGET_S: "2100"
        run: |
          # Required steps fail the run, so nothing is uploaded or published and the live data stays.
          # Optional steps (external lookups that resume next run) only warn and keep their previous output.
          I=_ingest/copybook/ingest
          if [ "$SCOPE" = full ]; then
            ( while sleep 60; do
                echo "res $(date -u +%T) $(free -m | awk '/^Mem/{printf "mem_used=%sM avail=%sM ",$3,$7} /^Swap/{printf "swap=%s/%sM ",$3,$2}')disk_avail=$(df -m --output=avail . | tail -1 | tr -d ' ')M top=$(ps -eo rss=,args= --sort=-rss | head -1 | awk '{printf "%dM %s %s", $1/1024, $2, $3}')"
              done ) &
            # optional: SEC 13F data sets (seeds the fb/ full books once per period; stocks.py falls back to f/).
            # Before build.py, whose split detection reads every filer's full books.
            if [ -f $I/datasets.py ]; then python $I/datasets.py || echo "::warning::optional: SEC 13F data sets failed"; fi
          fi
          python $I/build.py
          if [ "$SCOPE" = full ]; then
            # optional: all-filer shards (time-budgeted; picks up where it stopped next run)
            python $I/bulk.py || echo "::warning::optional: bulk ingest failed"
            # optional: OpenFIGI lookups for new CUSIPs (the cached map covers the rest)
            python $I/figi.py public/copybook/data || echo "::warning::optional: ticker lookup failed"
            python $I/securities.py public/copybook/data
          fi
          python $I/enrich.py
          # moves.py is required (lead, Nov 11: it feeds paid /v1 and alerts). If it fails, the previous good hl/, hlr/,
          # changes/ and fq/ stay (Pages from git, R2 untouched: the uploader never deletes), the rest publishes, and
          # the run ends failed ("Fail if moves failed"), so a crash shows red.
          moves() {
            if ! python $I/moves.py; then
              echo "::error::moves.py failed: the previous hl/, hlr/, changes/ and fq/ stay; the rest publishes; this run fails"
              D=public/copybook/data
              git checkout HEAD -- $D/hl $D/hlr 2>/dev/null || true
              git clean -fdq -- $D/hl $D/hlr || true
              rm -rf $D/changes $D/fq $D/hlf  # hlf/ is what the uploader sends as R2 hl/: never a half-new build
              echo "MOVES_FAILED=1" >> "$GITHUB_ENV"
            fi
          }
          # optional: Form 4 / 13D/G events (the previous events files stay)
          python $I/events.py || echo "::warning::optional: Form 4 / 13D/G events failed"
          if [ "$SCOPE" = full ]; then
            # optional: filer type per CIK (hedge_fund, active, index, bank, ...), read by stocks.py and moves.py
            if [ -f $I/filer_types.py ]; then python $I/filer_types.py || echo "::warning::optional: filer types failed"; fi
          else
            # reviewed type cases on top of the last full run's types (the gate checks them every run)
            python $I/filer_types.py --overrides
            # A tracked fund filed a new 13F-HR: rebuild hl/ now (about 5 minutes), not at the next full run.
            new=$(python3 -c 'import json; print(len(json.load(open("public/copybook/data/alerts.json")).get("new_filings") or []))' || echo 0)
            # Or the type set changed (hand overrides above): hl/, hedge_flow.json and fall/ follow it now, so every
            # lens matches filer_types.json and index.json types_as_of.
            stale=$(python $I/filer_types.py --lenses-stale || echo 0)
            # Or quality.json (held lines, /status/) isn't published yet: moves.py writes it.
            # Or hl/ was written by an older row shape (moves.py HL_SCHEMA).
            schema=$(python $I/moves.py --schema-stale || echo 0)
            if { [ "${new:-0}" != 0 ] || [ "${stale:-0}" = 1 ] || [ "${schema:-0}" = 1 ] || [ ! -f public/copybook/data/quality.json ]; } && [ -d public/copybook/data/fb ]; then
              echo "rebuilding hl/: new=${new:-0} lenses_stale=${stale:-0}"
              moves
            fi
          fi
          if [ "$SCOPE" = full ]; then
            python $I/stocks.py
            # optional: EDGAR acceptance time for every shard's filing (hl/ rows, changes, fq/ books)
            if [ -f $I/accepted.py ]; then python $I/accepted.py || echo "::warning::optional: acceptance times failed"; fi
            # required: every filer's moves vs its previous quarter (shard summary public, full rows to R2)
            moves
            # optional: bulk/{quarter}.csv.gz exports for the Copy API (R2 only)
            if [ -f $I/export.py ]; then python $I/export.py || echo "::warning::optional: bulk export failed"; fi
          fi
          # optional, last: Holdterm's funds' books in one file, after every step that writes {slug}.json
          if [ -f $I/books.py ]; then python $I/books.py || echo "::warning::optional: books.json failed"; fi
      # A failed gate stops the run here: nothing goes to R2 or Pages, so the live data stays.
      - name: Refuse to publish a build that lost tickers
        run: |
          G=_ingest/copybook/ingest/gate.py
          if [ -f $G ]; then python $G public/copybook/data; fi
      # A full run saved its h/ cache after this curated run restored its own: this run's hlf/ and manifest are older
      # than the full run's hl/, so it sends nothing to the API (no older hl/ objects or meta/builds.json over the full
      # run's), keeps its cache unsaved, and publishes head's all-filer outputs (Commit and deploy).
      - name: Check whether a full run superseded this run's cache
        if: env.SCOPE != 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(bash .github/copybook-cache.sh superseded "$H_RESTORED_AT" || echo 0)
          echo "superseded=$s (cache restored at $H_RESTORED_AT)"
          if [ "$s" = 1 ]; then echo "SUPERSEDED=1" >> "$GITHUB_ENV"; fi
      # Lanes: a keepalive yields to a filing run (no upload, cache save or commit; the filing run fetches the same
      # filings); a filing run waits for a keepalive's upload in flight (at most its 10-minute budget), so only one
      # curated run talks to the API at a time.
      - name: Give way between curated lanes
        if: env.SCOPE != 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C=.github/copybook-cache.sh
          if [ "$KEEPALIVE" = 1 ]; then
            if [ "$(bash $C filing-active)" != 0 ]; then echo "A filing run is active: yielding"; echo "YIELD=1" >> "$GITHUB_ENV"; fi
          else
            t=$SECONDS
            while [ "$(bash $C keepalive-uploading)" != 0 ] && [ $((SECONDS - t)) -lt 660 ]; do sleep 10; done
            echo "waited $((SECONDS - t))s for a keepalive upload"
          fi
      - name: Upload paid history to R2
        id: upload
        if: env.SUPERSEDED != '1' && env.YIELD != '1'
        # Resumed 2026-11-09 at the API's go: one bundle at a time, at most 100 files / 20 MB each.
        continue-on-error: true
        env:
          PYTHONPATH: _ingest/copybook
          COPYBOOK_WEB_DIR: public/copybook
          # The self-hosted Copy API through Tailscale Funnel: no 100 s cap (the trycloudflare tunnel in api.json
          # returned HTTP 524 on a 19 MB bundle) and no Cloudflare bulk traffic. Bundles stay at 5 MB.
          COPYBOOK_API: https://gene.tail70ba3.ts.net/copybook
          # Curated runs upload for at most 10 minutes (3 before Nov 11 18:00): hlf/ is cached with h/, so every curated run
          # continues the holder-index upload a rebuild started; publishing waits at most that long.
          COPYBOOK_UPLOAD_BUDGET_S: ${{ (env.SCOPE == 'full' || inputs.restamp_hl) && '3000' || '600' }}
          COPYBOOK_RESTAMP_HL: ${{ inputs.restamp_hl && '1' || '' }}
          # Path A test on gene (runner), Nov 11: no uploads 15:55-16:35 UTC; a full run holds until 16:35. Remove after.
        # Any non-200 fails this step; h/ then stays on Pages (see commit step) and the job fails at the end.
        run: python _ingest/copybook/ingest/upload_history.py
      - name: Check again before saving the h/ cache
        if: always() && env.SCOPE != 'full' && env.SUPERSEDED != '1' && env.YIELD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(bash .github/copybook-cache.sh superseded "$H_RESTORED_AT" || echo 0)" = 1 ]; then
            echo "A full run saved its cache during this run: not saving this one"; echo "SUPERSEDED=1" >> "$GITHUB_ENV"
          fi
          if [ "$KEEPALIVE" = 1 ] && [ "$(bash .github/copybook-cache.sh filing-active)" != 0 ]; then
            echo "A filing run is active: yielding"; echo "YIELD=1" >> "$GITHUB_ENV"
          fi
      # Curated runs save as copybook-h-{run}-v2 (pick takes those and full runs' copybook-h-{run}, never the older
      # curated keys a superseded run left).
      - uses: actions/cache/save@v4
        if: always() && env.SUPERSEDED != '1' && env.YIELD != '1'
        with:
          path: |
            public/copybook/data/h
            public/copybook/data/hlf
            public/copybook/data/.h-manifest.json
          key: copybook-h-${{ github.run_id }}${{ env.SCOPE != 'full' && '-v2' || '' }}
      - uses: actions/cache/save@v4
        if: always() && env.SCOPE == 'full'
        with:
          path: public/copybook/data/fb
          key: copybook-fb-${{ github.run_id }}
      - name: Commit and deploy
        if: env.YIELD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.upload.outcome }}
          # Fine-grained token with actions:write on factordynamics/site: rebuilds the site right after new data.
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # h/ leaves Pages only once every file is in R2; otherwise the Pages copy stays as the fallback.
          if [ "$UPLOADED" = success ]; then
            git rm -r -q --cached --ignore-unmatch public/copybook/data/h
          fi
          # Never publish a snapshot older than head. A curated run that lost the race publishes nothing;
          # a full run keeps its all-filer outputs and takes the newer curated snapshot from head.
          D=public/copybook/data
          gen() { python3 -c 'import json,sys; print(json.load(sys.stdin).get("generated_at") or "")' 2>/dev/null; }
          git fetch -q origin main
          HEAD_GEN=$(git show origin/main:$D/index.json 2>/dev/null | gen)
          OUR_GEN=$(gen < $D/index.json)
          KEEP="f fall hl hlr hedge_flow.json quality.json cusip_links.json consensus.json recent_filings.json filers.json filer_types.json types_guard.json stock_holders.json securities.json issuers.json cusip_map.json splits.json"
          # A curated run a full run superseded (see the check above) publishes its own snapshot but head's all-filer
          # outputs and meta/builds.json: never an older holder index over the full run's.
          if [ "$SCOPE" = curated ] && { [ "${SUPERSEDED:-}" = 1 ] \
              || [ "$(bash .github/copybook-cache.sh superseded "$H_RESTORED_AT" || echo 0)" = 1 ]; }; then
            echo "Superseded by a full run: taking head's all-filer outputs and meta/builds.json"
            for k in $KEEP meta/builds.json; do
              rm -rf "$D/$k"
              if git cat-file -e "origin/main:$D/$k" 2>/dev/null; then git checkout origin/main -- "$D/$k"; fi
            done
          fi
          # A full run's own meta/builds.json (written once the API took it) goes with its all-filer outputs.
          if [ "$SCOPE" = full ] && ! git diff --quiet HEAD -- $D/meta/builds.json; then KEEP="$KEEP meta"; fi
          if [ -n "$HEAD_GEN" ] && [[ "$HEAD_GEN" > "$OUR_GEN" ]]; then
            if [ "$SCOPE" = curated ]; then echo "Head has a newer snapshot ($HEAD_GEN > $OUR_GEN); nothing to publish"; exit 0; fi
            echo "Head has a newer curated snapshot ($HEAD_GEN > $OUR_GEN); publishing only the all-filer outputs on top of it"
            T=$(mktemp -d)
            for k in $KEEP; do if [ -e $D/$k ]; then cp -r $D/$k $T/; fi; done
            git checkout origin/main -- $D
            for k in $KEEP; do if [ -e $T/$k ]; then rm -rf $D/$k; cp -r $T/$k $D/; fi; done
            # head's index.json, with this run's type set date (the lenses above use this run's types)
            python3 -c 'import json,sys; d=sys.argv[1]; i=json.load(open(d+"/index.json")); i["types_as_of"]=json.load(open(d+"/filer_types.json")).get("as_of") or i.get("types_as_of"); open(d+"/index.json","w").write(json.dumps(i,separators=(",",":"))+"\n")' $D
          fi
          git add public/copybook/data
          if git diff --staged --quiet; then echo "No new filings"; exit 0; fi
          # Last look before the push: a keepalive never pushes while a filing run is active.
          if [ "$KEEPALIVE" = 1 ] && [ "$(bash .github/copybook-cache.sh filing-active)" != 0 ]; then
            echo "A filing run is active: yielding"; exit 0
          fi
          git commit -q -m "Refresh Copybook 13F data ($SCOPE)"
          # A file one run deleted and the other changed (hl/G2949D.json, Nov 11 10:05) stops -X theirs: this run's
          # side wins there too, as for every other path.
          take_ours() {
            for p in $(git diff --name-only --diff-filter=U); do
              if git cat-file -e "REBASE_HEAD:$p" 2>/dev/null; then git checkout REBASE_HEAD -- "$p" && git add "$p"; else git rm -q "$p"; fi
            done
            GIT_EDITOR=true git rebase --continue
          }
          for i in 1 2 3 4 5; do
            if { git pull -q --rebase -X theirs || take_ours || { git rebase --abort; false; }; } && git push -q; then
              gh workflow run ci.yml --ref main
              if [ -n "$SITE_DISPATCH_TOKEN" ]; then
                GH_TOKEN="$SITE_DISPATCH_TOKEN" gh workflow run copybook-pages.yml -R factordynamics/site --ref main \
                  || echo "::warning::site build dispatch failed"
              else
                echo "::notice::SITE_DISPATCH_TOKEN not set; the site rebuilds on its own schedule"
              fi
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Fail if moves failed
        if: env.MOVES_FAILED == '1'
        run: |
          echo "::error::moves.py failed: hl/, hlr/, changes/ and fq/ kept their previous build; everything else published."
          exit 1
      - name: Fail if the R2 upload failed
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::error::Paid history upload to R2 failed; public data was published and h/ stays on Pages."
          exit 1

name: Copybook keepalive

# GitHub's scheduler skips copybook-data.yml runs (none fired for 7 hours on Nov 8), and the
# Copy API Worker can dispatch it only once it has a GitHub token. Until then this chain keeps
# the data fresh with GITHUB_TOKEN alone: workflow_dispatch is the documented exception that a
# GITHUB_TOKEN may trigger. One job loops for about 5 hours, starting a curated refresh every 5 minutes
# unless one is queued or running, and a full one beside it when the last full run is 3 hours old, then dispatches its successor. The concurrency group keeps one chain; the
# cron restarts it if it dies. It ends itself once Worker-dispatched runs appear.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

concurrency:
  group: copybook-keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch Copybook refreshes every 20 minutes
        run: |
          runs() { gh run list --workflow copybook-data.yml -L 60 --json status,displayTitle,createdAt "$@"; }
          age() { echo $(( $(date -u +%s) - $(date -u -d "$1" +%s) )); }
          start=$SECONDS
          while [ $((SECONDS - start)) -lt 18000 ]; do
            since=$(date -u -d '-4 hours' +%FT%TZ)
            worker=$(runs -q "[.[] | select(.createdAt > \"$since\") | select(.displayTitle | contains(\"copybook-api\") or contains(\"filing by \"))] | length")
            if [ "${worker:-0}" != 0 ]; then echo "The Copy API Worker is dispatching refreshes; ending the chain."; exit 0; fi
            # A full run takes ~2.5 h; curated runs (new 13F-HRs within minutes) go on beside it.
            busy() { runs -q "[.[] | select(.status != \"completed\") | select(.displayTitle | contains(\"($1)\"))] | length"; }
            if [ "$(busy curated)" = 0 ]; then
              echo "$(date -u +%T) dispatch curated"
              gh workflow run copybook-data.yml --ref main -f scope=curated -f reason=keepalive || echo "::warning::dispatch failed"
            else
              echo "$(date -u +%T) a curated run is queued or running; skip"
            fi
            last_full=$(runs -q '[.[] | select(.displayTitle | contains("(full)"))][0].createdAt // "1970-01-01T00:00:00Z"')
            if [ "$(busy full)" = 0 ] && [ "$(age "$last_full")" -ge 10800 ]; then
              echo "$(date -u +%T) dispatch full"
              gh workflow run copybook-data.yml --ref main -f scope=full -f reason=keepalive || echo "::warning::dispatch failed"
            fi
            sleep 300
          done
          gh workflow run copybook-keepalive.yml --ref main
